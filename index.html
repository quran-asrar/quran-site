
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اسرار الیسری جز سی | ورود و ثبت‌نام</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="auth-container">

        <!-- لوگو -->

        <div class="auth-logo">

            <div class="logo-symbol">
                ☾
            </div>

            <h1 id="siteName">
                اسرار الیسری جز سی
            </h1>

            <p>
                مسیر حفظ کلام خدا
            </p>

        </div>


        <!-- فرم ورود و ثبت نام -->

        <div class="auth-card">

            <div class="auth-tabs">

                <button
                    type="button"
                    class="auth-tab active"
                    id="loginTab">
                    ورود
                </button>

                <button
                    type="button"
                    class="auth-tab"
                    id="registerTab">
                    ثبت‌نام
                </button>

            </div>


            <!-- فرم ورود -->

            <form id="loginForm">

                <h2>
                    خوش آمدید 🌿
                </h2>

                <p class="form-description">
                    برای ورود به اسرار الیسری اطلاعات خود را وارد کنید.
                </p>


                <label for="loginEmail">
                    ایمیل یا شماره موبایل
                </label>

                <input
                    type="text"
                    id="loginEmail"
                    placeholder="ایمیل یا شماره موبایل"
                    required
                >


                <label for="loginPassword">
                    رمز عبور
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="رمز عبور"
                    required
                >


                <button
                    type="submit"
                    class="auth-button">
                    ورود به سایت
                </button>


                <p class="switch-text">

                    حساب کاربری ندارید؟

                    <button
                        type="button"
                        id="goRegister">
                        ثبت‌نام کنید
                    </button>

                </p>

            </form>



            <!-- فرم ثبت نام -->

            <form
                id="registerForm"
                class="hidden">

                <h2>
                    ساخت حساب کاربری 🌱
                </h2>

                <p class="form-description">
                    حساب خود را بسازید و مسیر حفظ قرآن را آغاز کنید.
                </p>


                <label for="registerName">
                    نام و نام خانوادگی
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="نام و نام خانوادگی"
                    required
                >


                <label for="registerEmail">
                    ایمیل
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="example@email.com"
                    required
                >


                <label for="registerPhone">
                    شماره موبایل
                </label>

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="09xxxxxxxxx"
                    required
                >


                <label for="registerPassword">
                    رمز عبور
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="رمز عبور"
                    required
                >


                <label for="confirmPassword">
                    تکرار رمز عبور
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="تکرار رمز عبور"
                    required
                >


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        قوانین سایت را می‌پذیرم.
                    </span>

                </label>


                <button
                    type="submit"
                    class="auth-button">
                    ساخت حساب کاربری
                </button>


                <p class="switch-text">

                    قبلاً حساب ساخته‌اید؟

                    <button
                        type="button"
                        id="goLogin">
                        وارد شوید
                    </button>

                </p>

            </form>

        </div>


        <div class="auth-footer" id="siteFooter">
            © ۱۴۰۵ اسرار الیسری جز سی
        </div>

    </main>


    <!-- =========================
         تنظیمات سایت
    ========================== -->

    <script src="config.js"></script>

    <!-- =========================
         JavaScript
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
